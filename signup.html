
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Iskra Exchange</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; background: #f5f5f5;
      color: #111; font: 16px Arial, sans-serif;
    }
    main {
      background: white; padding: 32px; width: min(360px, 82vw);
      border: 1px solid #ddd;
    }
    input, button {
      box-sizing: border-box; width: 100%; padding: 12px;
      margin: 8px 0;
    }
    button { background: #111; color: white; border: 0; cursor: pointer; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Iskra Exchange</h1>
    <h2>Create your account</h2>
    <form id="signup-form">
      <label for="email">Business email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="new-password" minlength="12" required>

      <button type="submit">Create account</button>
    </form>
    <p id="message" role="status"></p>
    <p>Already registered? <a href="/login.html">Sign in</a></p>
  </main>

  <script type="module">
    import { signUp } from "./auth.js";

    const form = document.querySelector("#signup-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Creating account…";

      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      const { data, error } = await signUp(email, password);

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Registration submitted. Check your email for the confirmation link before signing in.";
      form.reset();
    });
  </script>
</body>
</html>

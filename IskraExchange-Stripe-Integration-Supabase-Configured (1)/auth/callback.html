<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirming account | Iskra Exchange</title><link rel="stylesheet" href="../style.css"><style>main{max-width:640px;margin:150px auto;padding:30px;position:relative;z-index:1}</style></head><body><div class="ambient-glow-1"></div><main><h1 class="section-title">Confirming your account</h1><p id="status">Checking your confirmation…</p><p><a href="../login.html">Go to sign in</a></p></main><script type="module">import {supabase} from '../js/auth.js';const el=document.querySelector('#status');const {data,error}=await supabase.auth.getSession();if(error){el.textContent='Confirmation could not be completed: '+error.message;}else if(data.session){el.textContent='Your account is confirmed. Opening your dashboard…';location.replace('../dashboard.html');}else{el.textContent='If confirmation succeeded, sign in to continue. If not, request a new confirmation email and check the Supabase redirect settings.';}</script></body></html>

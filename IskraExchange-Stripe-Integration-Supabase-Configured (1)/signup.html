<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Iskra Exchange</title><link rel="stylesheet" href="style.css"><style>.auth-wrap{max-width:560px;margin:150px auto 70px;padding:32px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.8);border-radius:24px;position:relative;z-index:1}.auth-wrap input{width:100%;padding:13px;margin:8px 0 16px;border:1px solid #c8b9a8;border-radius:10px;background:#fff}.auth-wrap button{padding:12px 20px;border:0;border-radius:999px;background:#211d19;color:#fff;cursor:pointer}.auth-wrap a{color:#6d4c31}.msg{margin-top:16px;overflow-wrap:anywhere}</style></head><body><div class="ambient-glow-1"></div><div class="ambient-glow-2"></div><main class="auth-wrap"><p class="section-eyebrow">Client access</p><h1 class="section-title">Create your account</h1><p>Register to access your Iskra Exchange customer dashboard.</p><form id="signup-form"><label for="email">Business email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (at least 12 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Create account</button></form><p id="message" class="msg" role="status"></p><p>Already registered? <a href="login.html">Sign in</a></p><p><a href="index.html">Return to Iskra Exchange</a></p></main><script type="module">import {supabase} from './js/auth.js'; import {APP_URL} from './js/config.js'; const form=document.querySelector('#signup-form'), msg=document.querySelector('#message'); form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Creating account…';const {data,error}=await supabase.auth.signUp({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value,options:{emailRedirectTo:APP_URL+'/auth/callback.html'}});if(error){msg.textContent=error.message;return;}msg.textContent=data.session?'Account created. Opening dashboard…':'Account created. Check your email and open the confirmation link to activate your account.';if(data.session)location.href='dashboard.html';});</script></body></html>

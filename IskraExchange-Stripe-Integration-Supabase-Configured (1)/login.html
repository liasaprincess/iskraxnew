<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Iskra Exchange</title><link rel="stylesheet" href="style.css"><style>.auth-wrap{max-width:560px;margin:150px auto 70px;padding:32px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.8);border-radius:24px;position:relative;z-index:1}.auth-wrap input{width:100%;padding:13px;margin:8px 0 16px;border:1px solid #c8b9a8;border-radius:10px;background:#fff}.auth-wrap button{padding:12px 20px;border:0;border-radius:999px;background:#211d19;color:#fff;cursor:pointer}.auth-wrap a{color:#6d4c31}.msg{margin-top:16px;overflow-wrap:anywhere}</style></head><body><div class="ambient-glow-1"></div><div class="ambient-glow-2"></div><main class="auth-wrap"><p class="section-eyebrow">Client access</p><h1 class="section-title">Sign in</h1><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p id="message" class="msg" role="status"></p><p>New to Iskra Exchange? <a href="signup.html">Create an account</a></p><p><a href="index.html">Return to Iskra Exchange</a></p></main><script type="module">import {supabase} from './js/auth.js';const form=document.querySelector('#login-form'),msg=document.querySelector('#message');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const {error}=await supabase.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(error){msg.textContent=error.message;return;}location.href='dashboard.html';});</script></body></html>

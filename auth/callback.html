
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirming Account | Iskra Exchange</title>
</head>
<body>
  <main>
    <h1>Iskra Exchange</h1>
    <p id="message" role="status">Confirming your account…</p>
  </main>

  <script type="module">
    import { supabase } from "../auth.js";

    const message = document.querySelector("#message");

    const { data, error } = await supabase.auth.getSession();

    if (error) {
      message.textContent =
        "Confirmation could not be completed. Please try the email link again.";
    } else if (data.session) {
      window.location.replace("/dashboard.html");
    } else {
      message.textContent =
        "If your email is confirmed, return to the sign-in page and log in.";
    }
  </script>
</body>
</html>
